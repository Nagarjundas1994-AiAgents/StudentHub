_schema-version: 3.3.0
ID: StudentHub
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: StudentHub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: StudentHub-auth
      - name: StudentHub-db
      - name: StudentHub-destination

  - name: StudentHub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: StudentHub-db

  - name: StudentHub-approuter
    type: approuter.nodejs
    path: approuter
    provides:
      - name: app-api
        properties:
          app-uri: ${default-uri}
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    build-parameters:
      builder: custom
      commands:
        - npm run copy-ui
      ignore:
        - node_modules/
    requires:
      - name: StudentHub-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: StudentHub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: StudentHub-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://~{app-api/app-uri}/**
        role-collections:
          - name: 'User (StudentHub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.User'
          - name: 'manager (StudentHub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.manager'
          - name: 'admin (StudentHub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
    requires:
      - name: app-api
  - name: StudentHub-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: StudentHub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
