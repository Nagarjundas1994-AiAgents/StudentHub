_schema-version: 3.3.0
ID: StudentHub
version: 1.0.0
description: "StudentHub CAP application with UI5, HANA Cloud and XSUAA"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # CAP Node.js backend
  - name: StudentHub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: StudentHub-auth
      - name: StudentHub-db
      - name: StudentHub-destination

  # HANA HDI database deployer
  - name: StudentHub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: StudentHub-db

  # UI5 AppRouter
  - name: StudentHub-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    build-parameters:
      builder: npm-ci
    provides:
      - name: app-api
        properties:
          app-uri: ${default-uri}
    requires:
      - name: StudentHub-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # XSUAA authentication
  - name: StudentHub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: StudentHub-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://~{app-api/app-uri}/**
    requires:
      - name: app-api

  # HANA Cloud HDI container
  - name: StudentHub-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # Destination service
  - name: StudentHub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite